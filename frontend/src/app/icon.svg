<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Accent Glow -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />
  
  <!-- Antenna Rod and Glowing Pulse -->
  <line x1="256" y1="88" x2="256" y2="132" stroke="#94a3b8" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="76" r="22" fill="url(#glowGrad)" filter="url(#glow)" />
  <circle cx="256" cy="76" r="10" fill="#ffffff" />

  <!-- Ear / Headset nodes -->
  <rect x="76" y="208" width="28" height="94" rx="14" fill="#334155" stroke="#475569" stroke-width="3" />
  <rect x="408" y="208" width="28" height="94" rx="14" fill="#334155" stroke="#475569" stroke-width="3" />
  <line x1="88" y1="255" x2="104" y2="255" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <line x1="408" y1="255" x2="424" y2="255" stroke="#10b981" stroke-width="6" stroke-linecap="round" />

  <!-- Robot Head Outline -->
  <rect x="104" y="132" width="304" height="244" rx="54" fill="url(#headGrad)" stroke="#334155" stroke-width="6" />

  <!-- Visor Screen -->
  <rect x="140" y="168" width="232" height="134" rx="34" fill="#020617" stroke="#1e293b" stroke-width="4" />

  <!-- Glowing Bot Eyes -->
  <g filter="url(#glow)">
    <rect x="176" y="206" width="44" height="58" rx="22" fill="url(#glowGrad)" />
    <rect x="292" y="206" width="44" height="58" rx="22" fill="url(#glowGrad)" />
  </g>
  <!-- Eye Specular Highlights -->
  <circle cx="188" cy="220" r="7" fill="#ffffff" />
  <circle cx="304" cy="220" r="7" fill="#ffffff" />

  <!-- Audio Waveform Smile -->
  <line x1="220" y1="332" x2="220" y2="344" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <line x1="238" y1="326" x2="238" y2="350" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="322" x2="256" y2="354" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
  <line x1="274" y1="326" x2="274" y2="350" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  <line x1="292" y1="332" x2="292" y2="344" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
</svg>